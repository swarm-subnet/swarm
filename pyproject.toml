[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-sotapilot"
dynamic = ["version", "dependencies"]
description = "Open autonomous drone navigation benchmark and CLI"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Swarm" }
]
keywords = [
  "autonomous-drones",
  "benchmark",
  "bittensor",
  "navigation",
  "robotics",
  "swarm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/swarm-subnet/swarm"
Repository = "https://github.com/swarm-subnet/swarm"
Issues = "https://github.com/swarm-subnet/swarm/issues"

[project.scripts]
swarm = "swarm.cli:main"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["swarm*", "neurons*", "miner*", "validator", "validator.scripts*"]
exclude = ["miner.tests*", "validator.tests*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]
"swarm" = [
  "assets/Drone_flying.gif",
  "assets/Drone_flying_FPV.gif",
  "assets/Drone_flying.mp4",
  "assets/map_images/*",
  "assets/maps/forest/terrain_cache/*",
  "assets/open_terrain/*",
]

[tool.setuptools.dynamic]
version = { attr = "swarm.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 200
target-version = "py311"
extend-exclude = ["swarm/assets", "artifacts", "miner_env"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/_shared.py" = ["F401"]
"**/__init__.py" = ["F401", "F403"]
"**/*_parts/**" = ["F403", "F405"]
"swarm/core/warehouse/**" = ["F403", "F405"]
# The backend keeps a byte-identical mirror of this module under a different import
# root, so the two repos sort these imports in provably opposite orders.
"swarm/submission_manifest/__init__.py" = ["I001"]
"swarm/core/city_generator.py" = ["F403"]
"swarm/core/forest_generator.py" = ["F403"]
"swarm/core/mountain_generator.py" = ["F403"]

[tool.codespell]
ignore-words-list = "froms,statics,oppen"

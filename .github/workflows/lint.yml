name: Lint

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Deliberately not the docker image the tests use. Linting needs the source
  # and the linters, not the runtime, and a bare runner starts in seconds
  # where pulling the image takes minutes.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history because the docstring hook diffs against the merge base with the
      # target branch, which a shallow clone does not contain.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # pre-commit runs every hook in this repo's config from one place, so
      # what CI checks and what a commit checks cannot drift apart.
      # Run inline: pre-commit/action pins actions/cache@v4 and ships no new tags.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - run: python -m pip install pre-commit

      - run: pre-commit run --all-files --show-diff-on-failure --color=always

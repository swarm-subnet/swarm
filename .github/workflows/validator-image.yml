name: Validator image

# Publishes the validator image after the tests pass on main.
#
# Tagged with swarm.__version__ and with :latest. A version that is already
# published is never overwritten: the tag is what operators pin to roll back, so
# it has to keep meaning one exact image.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/swarm-validator

jobs:
  publish:
    # workflow_run fires whatever the outcome was, so the result is checked here.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read the version
        id: version
        run: |
          version="$(grep -Eo '^__version__[[:space:]]*=[[:space:]]*"[^"]+"' swarm/__init__.py \
                     | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          [[ -n "$version" ]] || { echo "could not read __version__"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip when this version is already published
        id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:${{ steps.version.outputs.version }} exists; nothing to publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up buildx
        if: steps.exists.outputs.already == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.exists.outputs.already == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/validator.Dockerfile
          push: true
          build-args: |
            SWARM_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

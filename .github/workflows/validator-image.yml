name: Validator image

# Publishes the validator image after the tests pass on main.
#
# Tagged with swarm.__version__ and with :latest. A version that is already
# published is never overwritten: the tag is what operators pin to roll back, so
# it has to keep meaning one exact image. A change to the image's own inputs
# without a version bump therefore moves :latest only.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Named after the repository, so a copy of it can never publish over the operators' image.
  IMAGE: ghcr.io/${{ github.repository }}-validator

jobs:
  publish:
    # workflow_run fires whatever the outcome was, so the result is checked here.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # the commit and its parent, which is all the input check below compares
          fetch-depth: 2

      - name: Check whether the image inputs changed
        id: inputs
        run: |
          # A manual run and an unknown parent both rebuild: rebuilding when unsure
          # costs minutes, skipping when unsure costs a stale image.
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] \
             && git rev-parse --verify --quiet HEAD^1 >/dev/null \
             && git diff --quiet HEAD^1 HEAD -- \
                  .docker/validator.Dockerfile \
                  .docker/validator.Dockerfile.dockerignore \
                  .docker/validator-entrypoint.sh \
                  validator/requirements.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Image inputs unchanged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Image inputs changed"
          fi

      - name: Read the version
        id: version
        run: |
          version="$(grep -Eo '^__version__[[:space:]]*=[[:space:]]*"[^"]+"' swarm/__init__.py \
                     | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          [[ -n "$version" ]] || { echo "could not read __version__"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      # The test image this commit's own Tests run built, not whatever :base points at now.
      - name: Name the base image
        id: base
        run: echo "image=ghcr.io/${{ github.repository }}:base-$(bash .docker/image_key.sh base)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide what to publish
        id: plan
        run: |
          version="${{ steps.version.outputs.version }}"
          if ! docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            printf 'tags=%s\n' "$IMAGE:$version,$IMAGE:latest" >> "$GITHUB_OUTPUT"
            echo "New version: publishing $version and latest"
          elif [ "${{ steps.inputs.outputs.changed }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            printf 'tags=%s\n' "$IMAGE:latest" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$version exists and stays as it is; publishing latest only"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$version exists and the image inputs are unchanged; nothing to publish"
          fi

      # The Tests workflow built this commit's image, ran the suite and the image checks
      # on it, and left it as :sha-<commit>. Publishing is giving that same image its tags,
      # so what operators pull is byte for byte what passed, and nothing is built twice.
      - name: Find the image the tests ran on
        id: tested
        if: steps.plan.outputs.publish == 'true'
        run: |
          source="$IMAGE:sha-${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && docker manifest inspect "$source" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Publishing the tested image $source"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No tested image to reuse; building and testing here"
          fi

      - name: Set up buildx
        if: steps.plan.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Tag the tested image
        if: steps.plan.outputs.publish == 'true' && steps.tested.outputs.found == 'true'
        run: |
          tags=()
          IFS=, read -ra names <<< "${{ steps.plan.outputs.tags }}"
          for name in "${names[@]}"; do tags+=(-t "$name"); done
          docker buildx imagetools create "${tags[@]}" "${{ steps.tested.outputs.source }}"

      # The images carry the real areas, and a GitHub-hosted runner has about 14 GB free; a self-hosted one keeps its folders.
      - name: Free disk space
        if: steps.plan.outputs.publish == 'true' && steps.tested.outputs.found != 'true' && runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache

      # A manual run, or a commit with no tested image, still builds and tests the image
      # here before anything is published.
      - name: Build for the test run
        if: steps.plan.outputs.publish == 'true' && steps.tested.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/validator.Dockerfile
          load: true
          build-args: |
            SWARM_VERSION=${{ steps.version.outputs.version }}
            BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: swarm-validator:candidate
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      # The validator tests run inside the image itself, as a plain uid with no wallet, so
      # what gets published is what passed and not merely what built. The checkout is
      # mounted the way the Tests workflow mounts it: the image ships neither .github nor a
      # writable state directory, and the suite reads one and writes the other.
      - name: Run the validator tests inside the image
        if: steps.plan.outputs.publish == 'true' && steps.tested.outputs.found != 'true'
        run: |
          # A hosted runner has 4 cores; a self-hosted machine has many more, and a worker a core
          # at about 3 GB each takes all its memory.
          cpus=$(( $(nproc) < 4 ? $(nproc) : 4 ))
          docker run --rm --cpus="$cpus" \
            -v "$PWD":/app \
            -w /app \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/app \
            -e HOME=/tmp \
            --user "$(id -u):$(id -g)" \
            swarm-validator:candidate \
            pytest -v validator/tests -n"$cpus" --dist worksteal -p no:cacheprovider --timeout=300

      - name: Push
        if: steps.plan.outputs.publish == 'true' && steps.tested.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/validator.Dockerfile
          push: true
          build-args: |
            SWARM_VERSION=${{ steps.version.outputs.version }}
            BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: ${{ steps.plan.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

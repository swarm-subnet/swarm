name: Tests

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

# a new push cancels the run already going
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  # Named after the repository, so every copy of it builds and tests on its own images.
  # CI tests on :base-<inputs>; :base itself is main's image, which local validator builds start from.
  TEST_IMAGE: ghcr.io/${{ github.repository }}:base
  # The validator tests run inside the validator image itself. A pull request uses a CI-only
  # ci-<inputs> tag; main builds the image of its own commit as :sha-<commit>, and that
  # one image is what the publish workflow gives its version tag once the tests passed.
  VALIDATOR_IMAGE: ghcr.io/${{ github.repository }}-validator

jobs:
  family-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate family release declarations
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$MERGE_BASE" ;;
            push) base="$PUSH_BASE" ;;
          esac
          python3 validator/scripts/check_family_versions.py --base "$base"

  # Each test image is named after the files it is built from, so every branch tests on
  # the image its own commit describes, never on whichever one another branch pushed last.
  push-docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.check.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this image already exists
        id: check
        run: |
          # requirements.txt is baked into the image, so it is part of the name.
          image="$TEST_IMAGE-$(bash .docker/image_key.sh base)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "$image exists, keeping it"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$image does not exist, building it"
          fi

      # The images carry the real areas, and a GitHub-hosted runner has about 14 GB free; a self-hosted one keeps its folders.
      - name: Free disk space
        if: steps.check.outputs.changed == 'true' && runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache

      - name: Set up buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      # The layers that did not change come from the registry cache, so a new
      # dependency does not rebuild the system packages and torch under it.
      - name: Build and push the image
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          push: true
          tags: ${{ steps.check.outputs.image }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      # Operators' local validator builds start from :base, so only main moves it.
      - name: Point the base tag at main's image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.check.outputs.image }}
        run: docker buildx imagetools create -t "$TEST_IMAGE" "$IMAGE"

  # The validator image sits on the test image, so its name covers that image and its own inputs.
  push-validator-image:
    needs: push-docker-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this image already exists
        id: check
        env:
          BASE: ${{ needs.push-docker-image.outputs.image }}
        run: |
          version="$(grep -Eo '^__version__[[:space:]]*=[[:space:]]*"[^"]+"' swarm/__init__.py \
                     | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=${version:-dev}" >> "$GITHUB_OUTPUT"
          # A commit on main is built as its own image, code included: the tests run on it
          # and the publish workflow then tags that same image, so it is never built twice.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "tag=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "image=$VALIDATOR_IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Building the image of commit $GITHUB_SHA"
            exit 0
          fi
          tag="ci-$(bash .docker/image_key.sh validator "$BASE")"
          image="$VALIDATOR_IMAGE:$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "$image exists, keeping it"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$image does not exist, building it"
          fi

      # The images carry the real areas, and a GitHub-hosted runner has about 14 GB free; a self-hosted one keeps its folders.
      - name: Free disk space
        if: steps.check.outputs.changed == 'true' && runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache

      - name: Set up buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      # The dependency layer comes from the registry cache unless the requirements changed.
      - name: Build and push the image
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/validator.Dockerfile
          pull: true
          push: true
          build-args: |
            SWARM_VERSION=${{ steps.check.outputs.version }}
            BASE_IMAGE=${{ needs.push-docker-image.outputs.image }}
          tags: ${{ steps.check.outputs.image }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-validator:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-validator:buildcache,mode=max

  # Both sides run on every pull request, whichever side it changed. Deciding a
  # change is confined to one of them is a claim the run would then not be
  # checking, and the two are less separate than the folders suggest.
  miner:
    needs: push-docker-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The images carry the real areas, and a GitHub-hosted runner has about 14 GB free; a self-hosted one keeps its folders.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache

      - name: Pull test image
        # A pull of a large image can lose its connection once; it is tried again before the job fails.
        run: for try in 1 2 3; do docker pull "${{ needs.push-docker-image.outputs.image }}" && exit 0; sleep 15; done; exit 1

      - name: Run the miner tests
        run: |
          # Four CPUs, or all the runner has: a private repository's runner has two.
          cpus=$(( $(nproc) < 4 ? $(nproc) : 4 ))
          docker run --rm \
            --cpus="$cpus" \
            -v "$PWD":/app \
            -w /app \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/app \
            -e HOME=/tmp \
            --user "$(id -u):$(id -g)" \
            "${{ needs.push-docker-image.outputs.image }}" \
            pytest -v miner/tests -n 0 -p no:cacheprovider
        # -n 0 overrides the -n auto in addopts. The wheel these tests inspect is built
        # once per worker that asks for it, so spreading 35 tests over twelve is slower
        # than running them in order, and the names come out interleaved.

  # The suite is split by recorded run time (.test_durations) so the shards finish together;
  # a test missing from that file counts as an average one.
  validator:
    name: validator (${{ matrix.shard }}/4)
    needs: push-validator-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # On pull_request this checks out the MERGE commit: the PR branch
      # already merged into the base branch. That is the state that would
      # exist after merging, which is what you want to test.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show what is under test
        run: |
          echo "event:      $GITHUB_EVENT_NAME"
          echo "PR branch:  ${{ github.head_ref || github.ref_name }}"
          echo "merging to: ${{ github.base_ref || '-' }}"
          git log --oneline -1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The images carry the real areas, and a GitHub-hosted runner has about 14 GB free; a self-hosted one keeps its folders.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache

      - name: Pull test image
        # A pull of a large image can lose its connection once; it is tried again before the job fails.
        run: for try in 1 2 3; do docker pull "$VALIDATOR_IMAGE:${{ needs.push-validator-image.outputs.tag }}" && exit 0; sleep 15; done; exit 1

      # One worker per CPU: each Sentinel world takes about 3 GB, so more workers than
      # CPUs get killed for memory without running any faster. A test that hangs fails
      # after five minutes, and one that takes over 30 s fails the run unless it carries
      # a time_budget mark of its own.
      - name: Run the validator tests
        run: |
          # A hosted runner has 4 cores; a self-hosted machine has many more, and a worker a core
          # at about 3 GB each takes all its memory.
          cpus=$(( $(nproc) < 4 ? $(nproc) : 4 ))
          docker run --rm \
            --cpus="$cpus" \
            -v "$PWD":/app \
            -w /app \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/app \
            -e HOME=/tmp \
            --user "$(id -u):$(id -g)" \
            "$VALIDATOR_IMAGE:${{ needs.push-validator-image.outputs.tag }}" \
            pytest -v validator/tests -n"$cpus" --dist worksteal -p no:cacheprovider --timeout=300 \
              --splits 4 --group ${{ matrix.shard }} --splitting-algorithm least_duration \
              --durations=20 --max-test-seconds=30

  # Apart from the shards so it runs once, beside them, and not after a quarter of the suite.
  validator-image-checks:
    needs: push-validator-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The validator tests never reach a real Docker daemon, so a path the host cannot see
      # passes them. This runs the first-time model check through the image the way an
      # operator's validator does, and a failure here also holds back the image publish.
      # Watched: the image inputs, the compose mounts, the code that hands paths to the
      # daemon, and the check and its workflow. A mount bug lives in any of them, not only
      # the image.
      - name: Check whether the image model check applies
        id: image_check
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$GITHUB_SHA^1" ;;
            push)         base="${{ github.event.before }}" ;;
            merge_group)  base="${{ github.event.merge_group.base_sha }}" ;;
            *)            base="" ;;
          esac
          if [ -n "$base" ] && git diff --quiet "$base" "$GITHUB_SHA" -- \
               .docker/ requirements.txt validator/requirements.txt \
               swarm/core/model_verify.py swarm/validator/docker/ \
               validator/scripts/image_model_check.py \
               validator/tests/default_model/ .github/workflows/tests.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the image check covers changed, skipping it"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # A private repository's runner has about 14 GB free, too little for both images this job holds.
      - name: Free disk space
        if: steps.image_check.outputs.run == 'true' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          df -h /

      - name: Log in to GHCR
        if: steps.image_check.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull test image
        if: steps.image_check.outputs.run == 'true'
        # A pull of a large image can lose its connection once; it is tried again before the job fails.
        run: for try in 1 2 3; do docker pull "$VALIDATOR_IMAGE:${{ needs.push-validator-image.outputs.tag }}" && exit 0; sleep 15; done; exit 1

      - name: Check a real model through the validator image
        if: steps.image_check.outputs.run == 'true'
        env:
          SWARM_VALIDATOR_IMAGE: ${{ env.VALIDATOR_IMAGE }}
          SWARM_VALIDATOR_TAG: ${{ needs.push-validator-image.outputs.tag }}
        run: bash .docker/image_model_check.sh

      # The validator runs as a plain uid, and a capability that does not reach the
      # firewall leaves every flight unlocked and the host excluded, with green unit tests.
      - name: Lock a container down through the validator image
        if: steps.image_check.outputs.run == 'true'
        env:
          SWARM_VALIDATOR_IMAGE: ${{ env.VALIDATOR_IMAGE }}
          SWARM_VALIDATOR_TAG: ${{ needs.push-validator-image.outputs.tag }}
        run: bash .docker/image_lockdown_check.sh

name: Tests

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

# a new push cancels the run already going
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  # the image you pushed to GHCR — change tag/digest here only
  TEST_IMAGE: ghcr.io/swarm-subnet/swarm:base

jobs:
  # Both sides run on every pull request, whichever side it changed. Deciding a
  # change is confined to one of them is a claim the run would then not be
  # checking, and the two are less separate than the folders suggest.
  miner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull test image
        run: docker pull "$TEST_IMAGE"

      - name: Run the miner tests
        run: |
          docker run --rm \
            --cpus=4 \
            -v "$PWD":/app \
            -w /app \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/app \
            -e HOME=/tmp \
            --user "$(id -u):$(id -g)" \
            "$TEST_IMAGE" \
            pytest -v miner/tests -n 0 -p no:cacheprovider
        # -n 0 overrides the -n auto in addopts. The wheel these tests inspect is built
        # once per worker that asks for it, so spreading 35 tests over twelve is slower
        # than running them in order, and the names come out interleaved.

  validator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # On pull_request this checks out the MERGE commit: the PR branch
      # already merged into the base branch. That is the state that would
      # exist after merging, which is what you want to test.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show what is under test
        run: |
          echo "event:      $GITHUB_EVENT_NAME"
          echo "PR branch:  ${{ github.head_ref || github.ref_name }}"
          echo "merging to: ${{ github.base_ref || '-' }}"
          git log --oneline -1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull test image
        run: docker pull "$TEST_IMAGE"

      - name: Run the validator tests
        run: |
          docker run --rm \
            --cpus=4 \
            -v "$PWD":/app \
            -w /app \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/app \
            -e HOME=/tmp \
            --user "$(id -u):$(id -g)" \
            "$TEST_IMAGE" \
            pytest -v tests -n4 --dist worksteal -p no:cacheprovider
